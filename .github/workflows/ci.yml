name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lint and build frontend (into backend/src/main/resources/static)
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Testcontainers uses the Docker daemon on the runner for integration tests.
      - name: Test backend
        working-directory: backend
        run: ./mvnw -B verify

  # Continuous delivery: only for pushes to main that passed the build above.
  image:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jennachoi/kren_v2:latest
            ghcr.io/jennachoi/kren_v2:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Rolls the new image out to the VM. Enabled once the repository variable DEPLOY_ENABLED is
  # "true" and the secrets VM_HOST, VM_USER and VM_SSH_KEY are set.
  deploy:
    needs: image
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Copy deploy files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: deploy/compose.prod.yaml,deploy/Caddyfile
          target: kren
          strip_components: 1
      - name: Pull and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/kren
            export KREN_IMAGE_TAG=${{ github.sha }}
            docker compose -f compose.prod.yaml pull app
            docker compose -f compose.prod.yaml up -d
            docker image prune -f
