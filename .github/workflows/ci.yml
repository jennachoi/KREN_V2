name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lint and build frontend (into backend/src/main/resources/static)
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Testcontainers uses the Docker daemon on the runner for integration tests.
      - name: Test backend
        working-directory: backend
        run: ./mvnw -B verify
