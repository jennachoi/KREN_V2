spring:
  application:
    name: kren
  docker:
    compose:
      # Dev: Spring Boot starts ../compose.yaml and wires the datasource automatically.
      file: ../compose.yaml
      lifecycle-management: start-only
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it.
    properties:
      # Loads lazy collections (e.g. interests on a page of penpals) in batches instead of N+1.
      hibernate.default_batch_fetch_size: 100
  flyway:
    locations: classpath:db/migration

server:
  servlet:
    session:
      cookie:
        same-site: lax

kren:
  delivery:
    # Divides every flight time (60 = an hour becomes a minute). 1 is the real product.
    time-scale: 1
    poll-interval: 5s
  random-letters:
    daily-limit: 3

management:
  endpoints:
    web:
      exposure:
        include: health
