spring:
  application:
    name: kren
  docker:
    compose:
      # Dev: Spring Boot starts ../compose.yaml and wires the datasource automatically.
      file: ../compose.yaml
      lifecycle-management: start-only
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it.
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
